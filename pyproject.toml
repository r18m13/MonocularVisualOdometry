[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "map-software"
version = "1.0.0"
description = "Educational UML/software-design project with a monocular visual-odometry prototype"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "matplotlib>=3.7",
    "networkx>=3.0",
]
